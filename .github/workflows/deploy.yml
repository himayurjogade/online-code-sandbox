name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Provision & Deploy to AWS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH Key File
        run: |
          mkdir -p "$HOME/keys"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/keys/builder_key.pem"
          chmod 600 "$HOME/keys/builder_key.pem"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Apply (Provision & Generate Inventory)
        working-directory: ./infrastructure/terraform
        run: |
          terraform init
          terraform apply -auto-approve
          if [ ! -f "../ansible/inventory.ini" ]; then
            echo "::error::Terraform did not generate ../ansible/inventory.ini"
            exit 1
          fi

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Wait for EC2 SSH Readiness
        run: |
          SERVER_IP=$(grep -A 1 '\[server\]' infrastructure/ansible/inventory.ini | grep -v '\[server\]' | awk '{print $1}' | head -n 1)
          echo "Waiting for EC2 SSH to become reachable at ${SERVER_IP}:22 ..."
          for i in $(seq 1 30); do
            if timeout 3 bash -c "cat < /dev/null > /dev/tcp/$SERVER_IP/22" 2>/dev/null || nc -z -w 3 "$SERVER_IP" 22 2>/dev/null; then
              echo "✅ SSH port 22 is open on $SERVER_IP!"
              sleep 5
              exit 0
            fi
            echo "Attempt $i/30: Port 22 not reachable yet, waiting 5s..."
            sleep 5
          done
          echo "::error::EC2 instance $SERVER_IP was not reachable over SSH port 22 after 150 seconds."
          exit 1

      - name: Run Ansible Deployment Playbook
        working-directory: ./infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          APP_REVISION="${{ github.event.workflow_run.head_sha || github.sha }}"
          ansible-playbook playbook.yml \
            -e "image_registry=ghcr.io/${REPO_OWNER}" \
            -e "image_tag=${IMAGE_TAG}" \
            -e "ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "repo_owner=${REPO_OWNER}" \
            -e "app_revision=${APP_REVISION}"

      - name: Post-Deployment Smoke Test
        run: |
          SERVER_IP=$(grep -A 1 '\[server\]' infrastructure/ansible/inventory.ini | grep -v '\[server\]' | awk '{print $1}' | head -n 1)
          if [ -n "$SERVER_IP" ]; then
            echo "Verifying web frontend at http://$SERVER_IP ..."
            curl -s -f "http://$SERVER_IP" > /dev/null || echo "::warning::Web frontend not responding on port 80"
            echo "Running smoke tests against deployed API at http://$SERVER_IP:3000 ..."
            chmod +x scripts/e2e-test.sh
            ./scripts/e2e-test.sh "http://$SERVER_IP:3000"
          else
            echo "::warning::Could not determine Server IP from inventory.ini to run smoke tests."
          fi
