name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Lint, Format, Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm test

  iac-check:
    name: IaC & Observability Rules Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format & Validate
        run: |
          terraform -chdir=infrastructure/terraform fmt -check
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate

      - name: Ansible Playbook Syntax Check
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          ansible-playbook -i localhost, infrastructure/ansible/playbook.yml --syntax-check

      - name: Validate Prometheus Alert & SLO Rules
        run: |
          docker run --rm --entrypoint promtool \
            -v ${{ github.workspace }}/infrastructure/prometheus:/etc/prometheus \
            prom/prometheus:latest check rules \
            /etc/prometheus/rules.yml /etc/prometheus/alerts.yml

  build-and-push:
    name: Build Docker Images (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [check, test, iac-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Application Services
          - name: api
            context: .
            file: apps/api/Dockerfile
            image_name: online-code-sandbox-api
            build_args: API_PORT=3000
          - name: worker
            context: .
            file: apps/worker/Dockerfile
            image_name: online-code-sandbox-worker
            build_args: ''
          - name: web
            context: .
            file: apps/web/Dockerfile
            image_name: online-code-sandbox-web
            build_args: API_PORT=3000

          # Sandbox Runtimes
          - name: sandbox-python
            context: docker/sandbox/python
            file: docker/sandbox/python/Dockerfile
            image_name: sandbox-python
            build_args: ''
          - name: sandbox-javascript
            context: docker/sandbox/javascript
            file: docker/sandbox/javascript/Dockerfile
            image_name: sandbox-javascript
            build_args: ''
          - name: sandbox-cpp
            context: docker/sandbox/cpp
            file: docker/sandbox/cpp/Dockerfile
            image_name: sandbox-cpp
            build_args: ''
          - name: sandbox-c
            context: docker/sandbox/c
            file: docker/sandbox/c/Dockerfile
            image_name: sandbox-c
            build_args: ''
          - name: sandbox-java
            context: docker/sandbox/java
            file: docker/sandbox/java/Dockerfile
            image_name: sandbox-java
            build_args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Registry Tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_OWNER}/${{ matrix.image_name }}"
          TAG_SHA="${IMAGE}:${{ github.sha }}"
          TAG_LATEST="${IMAGE}:latest"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${TAG_SHA},${TAG_LATEST}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${TAG_SHA}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-integration-test:
    name: End-to-End Multi-Language Verification
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Build & Launch Ephemeral Stack
        run: |
          docker compose up -d --build redis api worker

      - name: Run E2E Test Suite
        run: |
          chmod +x scripts/e2e-test.sh
          ./scripts/e2e-test.sh http://localhost:3000

      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Teardown Ephemeral Stack
        if: always()
        run: |
          docker compose down -v
