services:
  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/vinayak-jaybhaye}/online-code-sandbox-api:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    env_file:
      - .env

  # ── Worker ───────────────────────────────────────────────────────────────────
  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/vinayak-jaybhaye}/online-code-sandbox-worker:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Web (Frontend) ───────────────────────────────────────────────────────────
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/vinayak-jaybhaye}/online-code-sandbox-web:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      - api

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus

  # ── Alertmanager ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    ports:
      - '9093:9093'
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - '3002:3000'
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # ── Loki (log aggregation) ───────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    restart: always
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml

  # ── Promtail (log shipper) ───────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    restart: always
    volumes:
      - ./infrastructure/promtail/promtail.yml:/etc/promtail/promtail.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

  # ── Tempo (distributed tracing) ──────────────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    restart: always
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo/tempo.yml
    ports:
      - '3200:3200'
      - '4318:4318'
