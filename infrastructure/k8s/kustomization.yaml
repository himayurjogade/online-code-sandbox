apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandbox

resources:
  - namespace.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - prometheus.yaml
  - grafana.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-pod-dashboard
    files:
      - dashboards/k8s-pods.json
