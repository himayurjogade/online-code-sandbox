apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sandbox
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: ghcr.io/vinayak-jaybhaye/online-code-sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: metrics
          envFrom:
            - configMapRef:
                name: worker-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
