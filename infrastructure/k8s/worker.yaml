apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: sandbox
data:
  NODE_ENV: 'production'
  REDIS_URL: 'redis://redis.sandbox.svc.cluster.local:6379'
  EXECUTION_TIMEOUT_MS: '10000'
  MAX_OUTPUT_BYTES: '1048576'
  LOG_LEVEL: 'info'
  METRICS_PORT: '3001'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sandbox
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: ghcr.io/vinayak-jaybhaye/online-code-sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: metrics
          envFrom:
            - configMapRef:
                name: worker-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
