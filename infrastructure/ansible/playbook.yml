---
- name: Deploy Complete Stack to Single-Node Kubernetes (K3s) on EC2
  hosts: server
  become: yes
  gather_facts: false
  vars:
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('ghcr.io/vinayak-jaybhaye', true) }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"
    repo_owner: "{{ lookup('env', 'REPO_OWNER') | default('vinayak-jaybhaye', true) }}"
    app_revision: "{{ lookup('env', 'APP_REVISION') | default('main', true) }}"
    app_dir: /home/ubuntu/online-code-sandbox

  tasks:
    - name: Wait for SSH connection to become available
      wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5

    - name: Gather system facts
      setup:
    - name: Expand root filesystem if EBS disk was enlarged
      shell: |
        growpart /dev/nvme0n1 1 || growpart /dev/xvda 1 || true
        resize2fs /dev/nvme0n1p1 || resize2fs /dev/root || resize2fs /dev/xvda1 || true
      failed_when: false
      changed_when: false

    - name: Wait for cloud-init and system package manager locks
      shell: |
        if command -v cloud-init >/dev/null 2>&1; then
          cloud-init status --wait || true
        fi
        while fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 2
        done
      failed_when: false
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - git
          - curl
          - jq
        state: present

    - name: Install Docker via official script
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Install K3s (Single-Node Kubernetes)
      shell: |
        if ! command -v k3s >/dev/null 2>&1; then
          curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --disable traefik" sh -
        fi
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s service is running
      service:
        name: k3s
        state: started
        enabled: yes

    - name: Setup kubeconfig directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy K3s kubeconfig for ubuntu user
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Ensure KUBECONFIG and kubectl alias in bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: '{{ item }}'
        state: present
      loop:
        - 'export KUBECONFIG=/home/ubuntu/.kube/config'
        - 'alias kubectl="k3s kubectl"'

    - name: Ensure application and infrastructure directories exist
      file:
        path: '{{ app_dir }}/infrastructure'
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Kubernetes manifests to server
      copy:
        src: '{{ playbook_dir }}/../k8s/'
        dest: '{{ app_dir }}/infrastructure/k8s/'
        owner: ubuntu
        group: ubuntu

    - name: Log in to GHCR (if token provided)
      shell: |
        echo "{{ ghcr_token }}" | docker login ghcr.io --username "{{ repo_owner }}" --password-stdin
      no_log: true
      when: ghcr_token is defined and (ghcr_token | length > 0)

    - name: Pull and tag sandbox runner runtime images
      shell: |
        set -euxo pipefail
        docker pull {{ image_registry }}/{{ item }}:{{ image_tag }} || docker pull {{ image_registry }}/{{ item }}:latest || true
        docker tag {{ image_registry }}/{{ item }}:{{ image_tag }} {{ item }}:latest 2>/dev/null || docker tag {{ image_registry }}/{{ item }}:latest {{ item }}:latest || true
      loop:
        - sandbox-python
        - sandbox-javascript
        - sandbox-cpp
        - sandbox-c
        - sandbox-java
      args:
        executable: /bin/bash

    - name: Apply Kubernetes manifests via Kustomize
      shell: |
        k3s kubectl apply -k {{ app_dir }}/infrastructure/k8s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Wait for core workloads rollout
      shell: |
        k3s kubectl rollout status deployment/{{ item }} -n sandbox --timeout=180s
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      loop:
        - redis
        - api
        - worker
        - web
        - prometheus
        - grafana

    - name: Verify API health check
      uri:
        url: 'http://localhost:3000/api/health'
        status_code: 200
      register: api_health
      until: api_health.status == 200
      retries: 30
      delay: 3

    - name: Display deployed status
      debug:
        msg: '✅ Online Code Sandbox successfully deployed to single-node Kubernetes cluster!'
