---
- name: Setup Prerequisites on All Nodes
  hosts: all
  become: yes
  vars:
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('ghcr.io/vinayak-jaybhaye', true) }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"
    repo_owner: "{{ lookup('env', 'REPO_OWNER') | default('vinayak-jaybhaye', true) }}"
    app_revision: "{{ lookup('env', 'APP_REVISION') | default('main', true) }}"
  tasks:
    - name: Expand root filesystem if EBS disk was enlarged
      shell: |
        growpart /dev/nvme0n1 1 || growpart /dev/xvda 1 || true
        resize2fs /dev/nvme0n1p1 || resize2fs /dev/root || resize2fs /dev/xvda1 || true
      failed_when: false
      changed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name:
          - git
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu noble stable
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Reset connection so docker group is picked up
      meta: reset_connection

    - name: Clone or update repository
      git:
        repo: https://github.com/vinayak-jaybhaye/online-code-sandbox.git
        dest: /home/ubuntu/online-code-sandbox
        version: "{{ app_revision | default('main') }}"
        force: yes
      become: yes
      become_user: ubuntu

    - name: Create .env from example if not exists
      copy:
        src: /home/ubuntu/online-code-sandbox/.env.example
        dest: /home/ubuntu/online-code-sandbox/.env
        remote_src: yes
        owner: ubuntu
        force: no

- name: Setup Redis Node
  hosts: redis
  tasks:
    - name: Pull and Start Redis Container
      command: docker compose -f docker-compose.prod.yml up -d redis
      args:
        chdir: /home/ubuntu/online-code-sandbox

- name: Setup Worker Nodes
  hosts: workers
  vars:
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('ghcr.io/vinayak-jaybhaye', true) }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"
    repo_owner: "{{ lookup('env', 'REPO_OWNER') | default('vinayak-jaybhaye', true) }}"
  tasks:
    - name: Update REDIS_URL in .env
      lineinfile:
        path: /home/ubuntu/online-code-sandbox/.env
        regexp: '^REDIS_URL='
        line: 'REDIS_URL=redis://{{ redis_private_ip }}:6379'

    - name: Log in to GHCR
      shell: |
        echo "{{ ghcr_token }}" | docker login ghcr.io --username "{{ repo_owner }}" --password-stdin
      no_log: true
      when: ghcr_token is defined and (ghcr_token | length > 0)

    - name: Prune unused Docker data on worker to free disk space
      shell: |
        set -euxo pipefail
        docker system prune -af
      args:
        executable: /bin/bash

    - name: Pull and tag sandbox runtime images
      shell: |
        set -euxo pipefail
        docker pull {{ image_registry }}/{{ item }}:{{ image_tag }}
        docker tag {{ image_registry }}/{{ item }}:{{ image_tag }} {{ item }}
      loop:
        - sandbox-python
        - sandbox-javascript
        - sandbox-cpp
        - sandbox-c
        - sandbox-java
      args:
        executable: /bin/bash

    - name: Pull Worker service
      shell: |
        set -euxo pipefail
        docker compose -f docker-compose.prod.yml pull worker
      args:
        chdir: /home/ubuntu/online-code-sandbox
        executable: /bin/bash
      environment:
        IMAGE_REGISTRY: '{{ image_registry }}'
        IMAGE_TAG: '{{ image_tag }}'

    - name: Start Worker service
      shell: |
        set -euxo pipefail
        docker compose -f docker-compose.prod.yml up -d worker
      args:
        chdir: /home/ubuntu/online-code-sandbox
        executable: /bin/bash
      environment:
        IMAGE_REGISTRY: '{{ image_registry }}'
        IMAGE_TAG: '{{ image_tag }}'

- name: Setup API & Observability Node
  hosts: api
  vars:
    image_registry: "{{ lookup('env', 'IMAGE_REGISTRY') | default('ghcr.io/vinayak-jaybhaye', true) }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"
    repo_owner: "{{ lookup('env', 'REPO_OWNER') | default('vinayak-jaybhaye', true) }}"
  tasks:
    - name: Update REDIS_URL in .env
      lineinfile:
        path: /home/ubuntu/online-code-sandbox/.env
        regexp: '^REDIS_URL='
        line: 'REDIS_URL=redis://{{ redis_private_ip }}:6379'

    - name: Ensure WEB_PORT is 80 in .env for production
      lineinfile:
        path: /home/ubuntu/online-code-sandbox/.env
        regexp: '^WEB_PORT='
        line: 'WEB_PORT=80'

    - name: Log in to GHCR
      shell: |
        echo "{{ ghcr_token }}" | docker login ghcr.io --username "{{ repo_owner }}" --password-stdin
      no_log: true
      when: ghcr_token is defined and (ghcr_token | length > 0)

    - name: Prune unused Docker data to free disk space
      shell: |
        set -euxo pipefail
        docker system prune -af
      args:
        executable: /bin/bash

    - name: Pull API and web images
      shell: |
        set -euxo pipefail
        docker compose -f docker-compose.prod.yml pull api web
      args:
        chdir: /home/ubuntu/online-code-sandbox
        executable: /bin/bash
      environment:
        IMAGE_REGISTRY: '{{ image_registry }}'
        IMAGE_TAG: '{{ image_tag }}'

    - name: Start API, web, and observability services
      block:
        - name: Validate resolved Compose configuration
          shell: |
            set -euxo pipefail
            docker compose -f docker-compose.prod.yml config
          args:
            chdir: /home/ubuntu/online-code-sandbox
            executable: /bin/bash
          environment:
            IMAGE_REGISTRY: '{{ image_registry }}'
            IMAGE_TAG: '{{ image_tag }}'

        - name: Start API, web, and observability services
          shell: |
            set -euxo pipefail
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          args:
            chdir: /home/ubuntu/online-code-sandbox
            executable: /bin/bash
          environment:
            IMAGE_REGISTRY: '{{ image_registry }}'
            IMAGE_TAG: '{{ image_tag }}'

      rescue:
        - name: Collect Compose diagnostics
          shell: |
            docker compose -f docker-compose.prod.yml ps -a
            docker ps -a
            docker compose -f docker-compose.prod.yml logs --no-color --tail=200
          args:
            chdir: /home/ubuntu/online-code-sandbox
            executable: /bin/bash
          register: compose_diagnostics
          changed_when: false

        - name: Show Compose diagnostics
          debug:
            var: compose_diagnostics.stdout_lines

        - name: Fail deployment
          fail:
            msg: 'Docker Compose failed to start the application services.'

    - name: Wait for API health check
      uri:
        url: 'http://localhost:3000/api/health'
        status_code: 200
      register: api_health
      until: api_health.status == 200
      retries: 25
      delay: 3
